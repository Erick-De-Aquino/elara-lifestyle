<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando clase... | ELARA METHOD</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="nav-container"></div>

    <main class="main-content">
        <div id="alumno-bar-container"></div>

        <div class="clase-container" id="clase-container">
            <div class="clase-header">
                <h1 id="clase-titulo"><i class="fas fa-spinner fa-pulse"></i> Cargando...</h1>
                <p id="clase-capitulo"></p>
                <div class="clase-meta">
                    <span id="clase-duracion"><i class="fas fa-clock"></i> Duración: -- min</span>
                    <span><i class="fas fa-calendar-week"></i> Práctica semanal</span>
                </div>
            </div>

            <div class="timer-panel">
                <div class="timer-title">
                    <i class="fas fa-hourglass-half"></i> ⏱️ Control de tiempos (click en cada bloque para ver contenido)
                </div>

                <div class="contenido-clase">
                    <h2>📖 Contenido de la clase</h2>
                    <h3>🎯 Objetivo de la clase</h3>
                    <p id="clase-objetivo">Cargando...</p>
                    
                    <h3>💡 Palabras clave</h3>
                    <ul id="clase-palabras-clave"></ul>
                </div>

                <div id="bloques-container" class="bloques-container"></div>
            </div>

            <div class="practica-semana" id="practica-semana">
                <i class="fas fa-tasks" style="font-size: 1.5rem; margin-bottom: 10px; display: inline-block;"></i>
                <h3>📌 Práctica de la semana</h3>
                <p id="practica-texto">Cargando...</p>
                <p id="practica-tip" style="margin-top: 10px; font-size: 0.9rem; opacity: 0.9;"></p>
            </div>

            <div class="videos-apoyo">
                <h3><i class="fab fa-youtube"></i> 📺 Videos de apoyo</h3>
                <div id="videos-container"></div>
            </div>

            <div class="formulario-comentarios">
                <h3><i class="fas fa-notes-medical"></i> 📝 Mis notas sobre el alumno</h3>
                <textarea id="comentariosClase" rows="4" placeholder="Anota aquí el progreso, dudas, observaciones..."></textarea>
                <button id="btnGuardarComentarios" class="btn-primary">💾 Guardar notas</button>
            </div>

            <div id="completada-badge-container" style="margin-top: 20px;"></div>
            <button id="btnMarcarCompletada" class="btn-marcar-completada">
                <i class="fas fa-check-circle"></i> ✅ Marcar esta clase como completada
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/comunes.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/alumno.js"></script>
    <script src="js/clase-dinamica.js"></script>
</body>
</html>
