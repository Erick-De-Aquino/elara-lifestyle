<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del profesor - ELARA METHOD</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="nav-container"></div>

    <main class="main-content">
        <div class="dashboard-header">
            <h1>📋 Panel del profesor</h1>
            <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
                <button id="btnExportarCSV" class="btn-success">
                    <i class="fas fa-file-csv"></i> 📥 Exportar CSV
                </button>
            </div>
            <button id="btnCerrarSesion" class="btn-cerrar-sesion">
                Cerrar sesión
            </button>
        </div>

        <!-- Sección: Acceso al curso -->
        <div class="dashboard-card">
            <h2><i class="fas fa-book-open"></i> Material del curso</h2>
            <p>Accede al contenido del curso para preparar tus clases</p>
            <button id="btnIrAlCurso" class="btn-primary">Ir al curso <i class="fas fa-arrow-right"></i></button>
        </div>

        <!-- Sección: Gestión de alumnos -->
        <div class="dashboard-card">
            <h2><i class="fas fa-users"></i> Gestión de alumnos</h2>
            
            <form id="formCrearAlumno" class="form-crear-alumno">
                <input type="text" id="nuevoUsuario" class="form-input" placeholder="Usuario *" required>
                <input type="text" id="nuevoNombre" class="form-input" placeholder="Nombre (opcional)">
                <input type="text" id="nuevaPassword" class="form-input" placeholder="Contraseña *" required>
                <button type="submit" class="btn-success">➕ Crear alumno</button>
            </form>
            
            <div id="lista-alumnos-container">
                <p class="text-center">Cargando alumnos...</p>
            </div>
        </div>
    </main>

    <!-- Modales -->
    <div id="modalMensajeProfesor" class="modal-confirmacion" style="display: none;">
        <div class="modal-confirmacion-content">
            <i id="modalIcono" class=""></i>
            <h3 id="modalTitulo"></h3>
            <p id="modalMensaje"></p>
            <div class="botones-modal">
                <button id="modalBtnCerrar" class="btn-aceptar">Aceptar</button>
            </div>
        </div>
    </div>

    <div id="modalConfirmarProfesor" class="modal-confirmacion" style="display: none;">
        <div class="modal-confirmacion-content">
            <i class="fas fa-exclamation-triangle icono-advertencia"></i>
            <h3>Confirmar eliminación</h3>
            <p id="confirmarMensaje"></p>
            <div class="botones-modal">
                <button id="confirmarSi" class="btn-confirmar">Sí, eliminar</button>
                <button id="confirmarNo" class="btn-cancelar-modal">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalDetalleAlumno" class="modal-confirmacion" style="display: none;">
        <div class="modal-confirmacion-content" style="max-width: 600px;">
            <i class="fas fa-user-graduate icono-exito"></i>
            <h3>Detalles del alumno</h3>
            <div id="detalleContenido"></div>
            <div class="botones-modal">
                <button id="detalleCerrar" class="btn-aceptar">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/comunes.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/profesor-alumnos.js"></script>
    <script src="js/profesor-dashboard.js"></script>
</body>
</html>
