<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - ELARA METHOD</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/alumno.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <main class="main-content">
        <div class="curso-header-wrapper">
            
            <div class="logo-header">
                <img src="../assets/logos/nombreSolo.svg" alt="ELARA METHOD">
            </div>
        
            <h1>📚 Índice del curso</h1>

            <div class="resumen-alumno" id="resumen-alumno">
                <div class="resumen-alumno-info">
                    <div class="resumen-alumno-nombre" id="alumno-nombre">Cargando...</div>
                    <div>Clases completadas: <span id="clases-completadas">0/14</span></div>
                    <div style="margin-top: 15px;">
                        <canvas id="graficoProgreso" width="200" height="200" style="max-width: 180px; max-height: 180px; margin: 0 auto;"></canvas>
                    </div>
                </div>

                <div class="botones-vertical">
                    <button id="btnVerApuntes" class="btn-secondary">
                        <i class="fas fa-notes-medical"></i> Ver mis apuntes
                    </button>
                    <button id="btnDescargarPDF" class="btn-secondary">
                        <i class="fas fa-file-pdf"></i> Descargar PDF
                    </button>
                    <button id="btnModoOscuroAlumno" class="btn-secondary">
                        <i class="fas fa-moon"></i> Modo oscuro
                    </button>
                    <button id="btnCerrarSesion" class="btn-cerrar-sesion">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </button>
                </div>
            </div>
        </div>

    <div id="accordion-container" class="accordion-container"></div>
    </main>

    <!-- Modal de apuntes -->
    <div id="modalApuntes" class="modal-confirmacion" style="display: none;">
        <div class="modal-confirmacion-content" style="max-width: 600px;">
            <i class="fas fa-notes-medical icono-exito"></i>
            <h3>📝 Mis apuntes</h3>
            <div id="apuntesContenido" style="max-height: 60vh; overflow-y: auto; text-align: left;"></div>
            <div class="botones-modal">
                <button id="btnCerrarApuntes" class="btn-aceptar">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="../js/supabase-config.js"></script>
    <script src="../js/alumno-curso.js"></script>
</body>
</html>
