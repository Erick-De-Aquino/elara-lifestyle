<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando clase... | ELARA METHOD</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/alumno.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="clase-page-wrapper">
        <!-- Contenido principal de la clase -->
        <main class="clase-contenido-principal">
            <div class="clase-container" id="clase-container">
                <div class="clase-header">
                    <h1 id="clase-titulo">Cargando...</h1>
                    <p id="clase-capitulo"></p>
                    <div class="clase-meta">
                        <span id="clase-duracion"><i class="fas fa-clock"></i> Duración: -- min</span>
                        <span><i class="fas fa-calendar-week"></i> Práctica semanal</span>
                    </div>
                </div>

                <div class="contenido-clase">
                    <h2>📖 Contenido de la clase</h2>
                    <h3>🎯 Objetivo</h3>
                    <p id="clase-objetivo"></p>
                    <h3>💡 Palabras clave</h3>
                    <ul id="clase-palabras-clave"></ul>
                    <div id="bloques-container"></div>
                </div>
                
                <div class="practica-semana">
                    <i class="fas fa-tasks"></i>
                    <h3>📌 Práctica de la semana</h3>
                    <p id="practica-texto"></p>
                    <p id="practica-tip"></p>
                </div>

                <div class="videos-apoyo">
                    <h3><i class="fab fa-youtube"></i> Videos de apoyo</h3>
                    <div id="videos-container"></div>
                </div>

                <div class="formulario-comentarios">
                    <h3><i class="fas fa-notes-medical"></i> Mis notas</h3>
                    <textarea id="comentariosClase" rows="4" placeholder="Anota aquí tus reflexiones..."></textarea>
                    <button id="btnGuardarComentarios" class="btn-primary">💾 Guardar comentarios</button>
                </div>

                <div id="completada-badge-container"></div>
            </div>
        </main>

        <!-- Sidebar derecho sticky con info del alumno -->
        <aside class="alumno-sidebar-derecho" id="alumnoSidebarDerecho">
    <div class="sidebar-info-alumno">
        <div class="sidebar-nombre" id="sidebar-nombre">Cargando...</div>
        <div class="sidebar-progreso-texto" id="sidebar-progreso-texto">Clases: 0/14</div>
        <div class="sidebar-grafico">
            <canvas id="sidebarGrafico" width="120" height="120" style="max-width: 100px; max-height: 100px; margin: 10px auto;"></canvas>
        </div>
    </div>
    <div class="sidebar-botones">
        <button id="btnVerApuntesSidebar" class="btn-sidebar">
            <i class="fas fa-notes-medical"></i> Mis apuntes
        </button>
        <button id="btnDescargarPDFSidebar" class="btn-sidebar">
            <i class="fas fa-file-pdf"></i> Descargar PDF
        </button>
        <button id="btnVolverIndiceSidebar" class="btn-sidebar">
            <i class="fas fa-arrow-left"></i> Volver al índice
        </button>
        <button id="btnModoOscuroSidebar" class="btn-sidebar">
            <i class="fas fa-moon"></i> Modo oscuro
        </button>
        <button id="btnCerrarSesionSidebar" class="btn-sidebar cerrar">
            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </button>
    </div>
</aside>
    </div>

    <!-- Modal de apuntes -->
    <div id="modalApuntes" class="modal-confirmacion" style="display: none;">
        <div class="modal-confirmacion-content" style="max-width: 600px;">
            <i class="fas fa-notes-medical icono-exito"></i>
            <h3>📝 Mis apuntes</h3>
            <div id="apuntesContenido" style="max-height: 60vh; overflow-y: auto; text-align: left;"></div>
            <div class="botones-modal">
                <button id="btnCerrarApuntes" class="btn-aceptar">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="../js/supabase-config.js"></script>
    <script src="../js/alumno-clase.js"></script>
</body>
</html>
