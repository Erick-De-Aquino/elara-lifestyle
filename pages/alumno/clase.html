<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase - ELARA LifeStyle</title>

    <!-- PWA -->
    <meta name="description" content="Plataforma oficial de ELARA LifeStyle">
    <meta name="theme-color" content="#FF8A00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ELARA">

    <link rel="manifest" href="../../manifest.webmanifest">

    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">

    <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg">

    <link rel="icon"
          type="image/png"
          sizes="96x96"
          href="../../assets/icons/favicon-96x96.png">

    <link rel="shortcut icon"
          href="../../assets/icons/favicon.ico">

    <!-- CSS Base -->
    <link rel="stylesheet" href="../../css/base/reset.css">
    <link rel="stylesheet" href="../../css/base/variables.css">
    <link rel="stylesheet" href="../../css/base/typography.css">

    <!-- CSS Components -->
    <link rel="stylesheet" href="../../css/components/navbar.css">
    <link rel="stylesheet" href="../../css/components/botones.css">
    <link rel="stylesheet" href="../../css/components/modales.css">
    <link rel="stylesheet" href="../../css/components/formularios.css">
    <link rel="stylesheet" href="../../css/components/tabs.css">

    <!-- CSS Layouts -->
    <link rel="stylesheet" href="../../css/layouts/alumno-layout.css">

    <!-- Tema oscuro -->
    <link rel="stylesheet" href="../../css/themes/dark-mode.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="header-container"></div>
    
    <main class="main-content">
        <div class="alumno-container" id="clase-container">
            <!-- Contenido dinámico -->
            <div class="loading-container" style="text-align: center; padding: var(--spacing-12);">
                <div style="width: 40px; height: 40px; border: 3px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto var(--spacing-4);"></div>
                <p>Cargando clase...</p>
            </div>
        </div>
    </main>

    <button id="btnAbrirApuntes" class="btn-apuntes-flotante" title="Mis apuntes">
        <i class="fas fa-pen"></i>
    </button>
    
    <!-- Core JS -->
    <script src="../../js/core/config.js"></script>
    <script src="../../js/core/utils.js"></script>
    <script src="../../js/core/modal.js"></script>
    <script src="../../js/core/dark-mode.js"></script>
    <script src="../../js/core/navegacion.js"></script>
    <script src="../../js/modules/auth.js"></script>
    <script src="../../js/modules/progreso.js"></script>
    <script src="../../js/pages/alumno-clase.js"></script>
</body>
</html>
