<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Elara LifeStyle</title>
    
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/base/typography.css">
    <link rel="stylesheet" href="css/components/botones.css">
    <link rel="stylesheet" href="css/components/formularios.css">
    <link rel="stylesheet" href="css/pages/login.css">
    <link rel="stylesheet" href="css/themes/dark-mode.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="assets/logos/logoNombre.svg" alt="Elara LifeStyle">
            </div>
            
            <h1 class="login-title">Restablecer Contraseña</h1>
            <p class="login-subtitle">Ingresa tu nueva contraseña</p>
            
            <form id="resetForm" class="login-form">
                <div class="form-group">
                    <label for="password">Nueva contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="login-btn">Actualizar Contraseña</button>
            </form>
        </div>
    </div>
    
    <script src="js/core/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/modal.js"></script>
    <script src="js/pages/reset-password.js"></script>
</body>
</html>
