<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Elara LifeStyle - Iniciar Sesión</title>
    
    <!-- CSS Base -->
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/base/typography.css">
    
    <!-- CSS Components -->
    <link rel="stylesheet" href="css/components/botones.css">
    <link rel="stylesheet" href="css/components/formularios.css">
    
    <!-- CSS Pages -->
    <link rel="stylesheet" href="css/pages/login.css">
    
    <!-- Tema oscuro -->
    <link rel="stylesheet" href="css/themes/dark-mode.css">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="assets/logos/logoNombre.svg" alt="Elara Method" onerror="this.src='assets/logos/logoSolo.png'">
            </div>
            
            <h1 class="login-title">Bienvenid</h1>
            <p class="login-subtitle">Inicia sesión para continuar</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Mostrar contraseña">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">Iniciar Sesión</button>

                <div class="login-footer-links">
                    <a href="#" id="btnOlvideContrasenna">¿Olvidaste tu contraseña?</a>
                </div>
                
            </form>
            
            <div class="login-footer">
                <p>© 2026 Elara lifeStyle - Todos los derechos reservados</p>
            </div>
        </div>
    </div>
    
    <!-- Core JS -->
    <script src="js/core/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/modal.js"></script>
    <script src="js/core/dark-mode.js"></script>
    <script src="js/modules/auth.js"></script>
    <script src="js/pages/login.js"></script>
    
</body>
</html>
