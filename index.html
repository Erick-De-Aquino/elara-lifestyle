<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - ELARA METHOD</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/alumno.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-container">
        <div class="logo-placeholder">
            <i class="fas fa-leaf"></i>
        </div>
        <h1>ELARA METHOD</h1>
        <p class="subtitle">Acceso para alumnos y profesor</p>
        
        <input type="text" id="loginUsuario" class="login-input" placeholder="Usuario" autocomplete="off">
        
        <div style="position: relative; width: 100%;">
            <input type="password" id="loginPassword" class="login-input" placeholder="Contraseña" style="padding-right: 40px;">
            <i class="fas fa-eye toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--gray-dark); z-index: 10;"></i>
        </div>
        
        <button id="loginBtn" class="login-btn">Acceder</button>
        
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/login-universal.js"></script>
</body>
</html>
