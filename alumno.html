<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha del alumno - ELARA METHOD</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="nav-container"></div>
    
    <main class="main-content">
        <h1 class="titulo-form">📝 Ficha del alumno</h1>
        
        <form id="alumnoForm" class="formulario-alumno">
            <div class="form-group">
                <label for="nombre">Nombre completo *</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="form-group">
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad">
            </div>
            
            <div class="form-group">
                <label for="objetivo">Objetivo principal</label>
                <select id="objetivo" name="objetivo">
                    <option value="">Seleccionar...</option>
                    <option value="adelgazar">Adelgazar</option>
                    <option value="ganar_musculo">Ganar masa muscular</option>
                    <option value="salud_longevidad">Salud y longevidad</option>
                    <option value="revertir_enfermedad">Revertir enfermedad</option>
                    <option value="energia">Más energía</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="enfermedades">Enfermedades (diabetes, hipertensión, etc.)</label>
                <input type="text" id="enfermedades" name="enfermedades" placeholder="Ej: Diabetes tipo 2, Hipertensión">
            </div>
            
            <div class="form-group">
                <label for="medicacion">Medicación actual</label>
                <input type="text" id="medicacion" name="medicacion" placeholder="Ej: Metformina, Enalapril">
            </div>
            
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            
            <div class="form-group">
                <label for="observaciones">Observaciones / Comentarios por clase</label>
                <textarea id="observaciones" name="observaciones" placeholder="Aquí irás anotando el progreso del alumno clase a clase..."></textarea>
            </div>
            
            <button type="submit" class="btn-guardar">
                <i class="fas fa-save"></i> Guardar alumno
            </button>
        </form>
    </main>

    <script src="js/comunes.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/alumno.js"></script>
    <script src="js/alumno-form.js"></script>
</body>
</html>
