<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario - ELARA METHOD</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="nav-container"></div>
    
    <main class="main-content">
        <div class="header-acciones">
            <h1>📅 Calendario de clases</h1>
                <button id="btnCerrarSesion" class="btn-header" style="background: var(--danger-red);">
                    </i> Cerrar sesión
                </button>
            </div>
        </div>
        
        <div class="calendario-container">
            <div class="panel">
                <div class="calendario-header">
                    <button id="btnMesAnterior" class="btn-mes">
                        <i class="fas fa-chevron-left"></i> Anterior
                    </button>
                    <h3 id="mesTitulo" class="mes-titulo"></h3>
                    <button id="btnMesSiguiente" class="btn-mes">
                        Siguiente <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div id="calendario"></div>
            </div>
            
            <div class="panel">
                <h3><i class="fas fa-list"></i> Clases programadas</h3>
                <div id="listaEventos" class="lista-clases"></div>
            </div>
        </div>
    </main>
    <!-- Modal para confirmaciones -->
<div id="modalConfirmarProfesor" class="modal-confirmacion" style="display: none;">
    <div class="modal-confirmacion-content">
        <i class="fas fa-exclamation-triangle icono-advertencia"></i>
        <h3>Confirmar acción</h3>
        <p id="confirmarMensaje"></p>
        <div class="botones-modal">
            <button id="confirmarSi" class="btn-confirmar">Sí</button>
            <button id="confirmarNo" class="btn-cancelar-modal">No</button>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/comunes.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/calendario.js"></script>
</body>
</html>
